<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fußball Quiz">
<title>Fußball Quiz</title>
<link rel="manifest" href="manifest.json?v=28">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=28">
<link rel="icon" href="icons/icon-192.png?v=28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=28">
</head>
<body>

<!-- ===== Startbildschirm ===== -->
<section id="screen-start" class="screen active">
  <div class="start-content">
    <img src="logos/ball-icon.png" alt="" class="brand-logo">
    <h1>Fußball Quiz</h1>
    <p class="subtitle">Kennst du alle Wappen und Spieler?</p>
    <button id="btn-play" class="big-button pulse" type="button">
      <span class="big-button-icon" data-icon="play"></span>
      <span>Spielen</span>
    </button>
    <button id="btn-learn" class="big-button secondary" type="button">
      <span class="big-button-icon" data-icon="search"></span>
      <span>Wappen entdecken</span>
    </button>
  </div>
  <button id="btn-settings" class="icon-button corner" type="button" aria-label="Einstellungen" title="Einstellungen (für Erwachsene)" data-icon="settings"></button>
</section>

<!-- ===== Liga-Auswahl ===== -->
<section id="screen-mode" class="screen">
  <header class="quiz-header">
    <button id="btn-mode-home" class="icon-button" type="button" aria-label="Zurück zum Start" data-icon="home"></button>
    <span></span>
    <span></span>
  </header>
  <div class="mode-content">
    <h2 class="mode-title">Was möchtest du spielen?</h2>
    <div class="mode-grid">
      <button id="mode-bundesliga" class="mode-tile" type="button">
        <img src="logos/bundesliga-icon.png" alt="">
        <span class="mode-label">Bundesliga</span>
      </button>
      <button id="mode-2bundesliga" class="mode-tile" type="button">
        <img src="logos/2-bundesliga-icon.png" alt="">
        <span class="mode-label">2. Bundesliga</span>
      </button>
      <button id="mode-3liga" class="mode-tile" type="button">
        <img src="logos/3-liga-icon.png" alt="">
        <span class="mode-label">3. Liga</span>
      </button>
      <button id="mode-legenden" class="mode-tile" type="button">
        <img src="logos/Legenden/beckenbauer.png" alt="">
        <span class="mode-label">Legenden</span>
      </button>
    </div>
  </div>
</section>

<!-- ===== Einstellungen (fürs Elternteil) ===== -->
<section id="screen-settings" class="screen">
  <div class="panel">
    <h2>Einstellungen</h2>

    <label class="setting-row">
      <span>Anzahl Antworten</span>
      <select id="opt-choices">
        <option value="2">2</option>
        <option value="3" selected>3</option>
        <option value="4">4</option>
      </select>
    </label>

    <label class="setting-row">
      <span>Sound</span>
      <input type="checkbox" id="opt-sound" checked>
    </label>

    <label class="setting-row">
      <span>Vorlesen (Sprache)</span>
      <input type="checkbox" id="opt-speech" checked>
    </label>

    <label class="setting-row">
      <span>Vorlesegeschwindigkeit</span>
      <input type="range" id="opt-rate" min="0.6" max="1.2" step="0.1" value="0.85">
    </label>

    <label class="setting-row">
      <span>Vorlesestimme</span>
      <select id="opt-voice"></select>
    </label>

    <button id="btn-reset-progress" class="text-button" type="button">Fortschritt zurücksetzen</button>
    <button id="btn-settings-back" class="big-button" type="button">Fertig</button>
  </div>
</section>

<!-- ===== Quiz ===== -->
<section id="screen-quiz" class="screen">
  <header class="quiz-header">
    <button id="btn-quiz-home" class="icon-button" type="button" aria-label="Zurück zum Start" data-icon="home"></button>
    <div id="progress-dots" class="progress-dots" aria-hidden="true"></div>
    <button id="btn-mute" class="icon-button" type="button" aria-label="Ton an/aus" data-icon="speaker"></button>
  </header>

  <div class="crest-stage">
    <div id="crest" class="crest"></div>
  </div>

  <div id="facts-panel" class="facts-panel" hidden>
    <p id="facts-text" class="facts-text"></p>
    <button id="btn-facts-replay" class="facts-replay" type="button">
      <span class="inline-icon" data-icon="speaker"></span> Fakten wiederholen
    </button>
  </div>

  <p class="hint-text"><span id="hint-label">Welcher Verein ist das?</span> Tippe zum Anhören auf <span class="inline-icon" data-icon="speaker"></span></p>

  <div id="choices" class="choices"></div>

  <div id="feedback-layer" class="feedback-layer" aria-hidden="true"></div>
</section>

<!-- ===== Entdecken (Lernmodus, ohne Quiz) ===== -->
<section id="screen-discover" class="screen">
  <header class="quiz-header">
    <button id="btn-discover-home" class="icon-button" type="button" aria-label="Zurück zum Start" data-icon="home"></button>
    <div id="discover-counter" class="discover-counter"></div>
    <span></span>
  </header>

  <div class="league-filter" role="group" aria-label="Liga-Filter">
    <button class="filter-btn active" type="button" data-filter="all">Alle</button>
    <button class="filter-btn" type="button" data-filter="bundesliga">1. Bundesliga</button>
    <button class="filter-btn" type="button" data-filter="2bundesliga">2. Bundesliga</button>
    <button class="filter-btn" type="button" data-filter="3liga">3. Liga</button>
  </div>

  <div class="crest-stage">
    <div id="discover-crest" class="crest big"></div>
  </div>

  <div id="discover-name" class="discover-name"></div>
  <div id="discover-league" class="discover-league"></div>

  <div class="discover-nav">
    <button id="btn-discover-prev" class="icon-button large" type="button" aria-label="Vorheriger Verein" data-icon="chevronLeft"></button>
    <button id="btn-discover-say" class="icon-button large" type="button" aria-label="Namen vorlesen" data-icon="speaker"></button>
    <button id="btn-discover-next" class="icon-button large" type="button" aria-label="Nächster Verein" data-icon="chevronRight"></button>
  </div>
</section>

<!-- ===== Runde geschafft ===== -->
<section id="screen-complete" class="screen">
  <div class="start-content">
    <div class="trophy" data-icon="trophy"></div>
    <h1>Super gemacht!</h1>
    <p id="complete-subtitle" class="subtitle">Du kennst jetzt alle Wappen!</p>
    <button id="btn-again" class="big-button pulse" type="button">
      <span class="big-button-icon" data-icon="repeat"></span>
      <span>Nochmal spielen</span>
    </button>
    <button id="btn-complete-home" class="big-button secondary" type="button">
      <span class="big-button-icon" data-icon="home"></span>
      <span>Zum Start</span>
    </button>
  </div>
</section>

<!-- WICHTIG: die Versionsnummer (?v=28) bei jeder Änderung an einer dieser
     Dateien (oder an styles.css/manifest.json/den Icons oben im <head>)
     um 1 hochzählen – das erzwingt frisches Laden trotz Service-Worker-
     Cache, auch wenn dieser selbst noch nicht aktualisiert wurde. Gleiche
     Nummer auch in manifest.json (icons) und service-worker.js
     (APP_SHELL) mitziehen. -->
<script src="data.js?v=28"></script>
<script src="icons.js?v=28"></script>
<script src="app.js?v=28"></script>
</body>
</html>
